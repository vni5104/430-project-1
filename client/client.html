<!DOCTYPE html>
<html lang="en">
<head>
    <title>Books Web API</title>
    <link rel="stylesheet" type="text/css" href="/style.css">

    <script>
        const handleResponse = async (response, method, content) => {
            switch (response.status) {
                case 200:
                    content.innerHTML = `<b>Success</b>`;
                    break;
                case 201:
                    content.innerHTML = `<b>Created</b>`;
                    break;
                case 204:
                    content.innerHTML = `<b>Updated (No Content)</b>`;
                    break;
                case 400:
                    content.innerHTML = `<b>Bad Request</b>`;
                    break;
                case 404:
                    content.innerHTML = `<b>Resource Not Found</b>`;
                    break;
                default:
                    content.innerHTML = `<b>Error code not implemented by client</b>`;
                    break;
            }

            if (method != 'head') {
                const obj = await response.json();

                if (obj.message) {
                    content.innerHTML += `<p>${obj.message}</p>`;
                }
                if (obj.books) {
                    for (let i = 0; i < obj.books.length; i++) {
                        content.innerHTML += `<p>${JSON.stringify(obj.books[i])}</p>`;
                    }
                }
                if (obj.authors) {
                    content.innerHTML += `<p>${JSON.stringify(obj.authors)}</p>`
                }
            }
        }

        const sendGetBook = async (getBookForm) => {
            let url = getBookForm.getAttribute('action');
            const method = getBookForm.querySelector('#methodSelect').value;

            const title = getBookForm.querySelector('#titleField').value;
            if (title) {
                url += `?title=${title}`;
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    Accept: 'application/json'
                }
            });

            const content = getBookForm.querySelector('#content');
            handleResponse(response, method, content);
        };

        const sendGetBooks = async (getBooksForm) => {
            let url = getBooksForm.getAttribute('action');
            const method = getBooksForm.querySelector('#methodSelect').value;

            const author = getBooksForm.querySelector('#authorField').value;
            const genre = getBooksForm.querySelector('#genreField').value;

            if (author && genre) {
                url += `?author=${author}&genres=${genre}`;
            } else if (author) {
                url += `?author=${author}`;
            } else if (genre) {
                url += `?genre=${genre}`;
            }

            const response = await fetch (url, {
                method,
                headers: {
                    Accept: 'application/json'
                }
            });

            const content = getBooksForm.querySelector('#content');
            handleResponse(response, method, content);
        }

        const sendGetAllBooks = async (getAllBooksForms) => {
            const url = getAllBooksForms.getAttribute('action');
            const method = getAllBooksForms.querySelector('#methodSelect').value;

            const response = await fetch (url, {
                method,
                headers: {
                    Accept: 'application/json'
                }
            });

            const content = getAllBooksForms.querySelector('#content');
            handleResponse(response, method, content);
        }

        const sendGetAuthors = async (getAuthorsForm) => {
            let url = getAuthorsForm.getAttribute('action');
            const method = getAuthorsForm.querySelector('#methodSelect').value;

            const country = getAuthorsForm.querySelector('#countryField').value;
            const language = getAuthorsForm.querySelector('#languageField').value;

            if (country && language) {
                url += `?country=${country}&language=${language}`;
            } else if (country) {
                url += `?country=${country}`;
            } else if (language) {
                url += `?language=${language}`;
            }

            const response = await fetch (url, {
                method,
                headers: {
                    Accept: 'application/json'
                }
            });

            const content = getAuthorsForm.querySelector('#content');
            handleResponse(response, method, content);
        }

        const sendAddBook = async (addBookForm) => {
            const url = addBookForm.getAttribute('action');
            const method = addBookForm.getAttribute('method');
            const dataType = addBookForm.querySelector('#dataTypeField').value;

            const author = addBookForm.querySelector('#authorField').value;
            const country = addBookForm.querySelector('#countryField').value;
            const language = addBookForm.querySelector('#languageField').value;
            const link = addBookForm.querySelector('#linkField').value;
            const pages = addBookForm.querySelector('#pageField').value;
            const title = addBookForm.querySelector('#titleField').value;
            const year = addBookForm.querySelector('#yearField').value;
            const genreValues = addBookForm.querySelector('#genresField').value;

            const genres = genreValues.split(',');

            let data = `author=${author}&country=${country}&language=${language}` + 
            `&link=${link}&pages=${pages}&title=${title}&year=${year}&genres=${genres}`;

            if (dataType === 'application/json') {
                data = JSON.stringify({
                    author: author,
                    country: country,
                    language: language,
                    link: link,
                    pages: pages,
                    title: title,
                    year: year,
                    genres: genres
                });
            }

            const response = await fetch (url, {
                method,
                headers: {
                    'Content-Type': dataType,
                    Accept: 'application/json'
                },
                body: data
            });

            const content = addBookForm.querySelector('#content');
            handleResponse(response, method, content);
        };

        const sendReviewBook = async (reviewBookForm) => {
            const url = reviewBookForm.getAttribute('action');
            const method = reviewBookForm.getAttribute('method');
            const dataType = reviewBookForm.querySelector('#dataTypeField').value;

            const title = reviewBookForm.querySelector('#titleField').value;
            const author = reviewBookForm.querySelector('#authorField').value;
            const review = reviewBookForm.querySelector('#reviewField').value;

            let data = `title=${title}&author=${author}review=${review}`;

            if (dataType === 'application/json') {
                data = JSON.stringify({title: title, author: author, review: review});
            }

            const response = await fetch(url, {
                method,
                headers: {
                    'Content-Type': dataType,
                    Accept: 'application/json'
                },
                body: data
            });

            const content = reviewBookForm.querySelector('#content');
            handleResponse(response, method, content);
        }

        const onFormSubmit = (e, sendRequest, form) => {
            e.preventDefault();
            sendRequest(form);
            return false;
        };

        const init = () => {
            const getBookForm = document.querySelector('#getBookForm');
            getBookForm.addEventListener('submit', (e) => onFormSubmit(e, sendGetBook, getBookForm));

            const getBooksForm = document.querySelector('#getBooksForm');
            getBooksForm.addEventListener('submit', (e) => onFormSubmit(e, sendGetBooks, getBooksForm));

            const getAllBooksForms = document.querySelector('#getAllBooksForm');
            getAllBooksForms.addEventListener('submit', (e) => onFormSubmit(e, sendGetAllBooks, getAllBooksForms));

            const getAuthorsForm = document.querySelector('#getAuthorsForm');
            getAuthorsForm.addEventListener('submit', (e) => onFormSubmit(e, sendGetAuthors, getAuthorsForm));

            const addBookForm = document.querySelector('#addBookForm');
            addBookForm.addEventListener('submit', (e) => onFormSubmit(e, sendAddBook, addBookForm));

            const reviewBookForm = document.querySelector('#reviewBookForm');
            reviewBookForm.addEventListener('submit', (e) => onFormSubmit(e, sendReviewBook, reviewBookForm));
        };

        window.onload = init;
    </script>
</head>
<body>
    <h1>Books API</h1>

    <!-- GET/HEAD Endpoints -->
    <div class="endpoint">
        <h2>Get Book</h2>
        <form id="getBookForm" action="/getBook">
            <label for="title">Title </label>
            <input id="titleField" type="text" name="title">
            <p></p>
            <label for="method">Method</label>
            <select id="methodSelect" name="method">
                <option value="get">GET</option>
                <option value="head">HEAD</option>
            </select>
            <input type="submit"/>
            <br><br><br>
            <section id="content"></section>
        </form>
    </div>

    <div class="endpoint">
        <h2>Get Books</h2>
        <form id="getBooksForm" action="/getBooks">
            <label for="author">Author </label>
            <input id="authorField" type="text" name="author">
            <p>AND/OR</p>
            <label for="genre">Genre </label>
            <input id="genreField" type="text" name="genre">
            <p></p>
            <label for="method">Method </label>
            <select id="methodSelect" name="method">
                <option value="get">GET</option>
                <option value="head">HEAD</option>
            </select>
            <input type="submit" />
            <br><br><br>
            <section id="content"></section>
        </form>
    </div>

    <div class="endpoint">
        <h2>Get All Books</h2>
        <form id="getAllBooksForm" action="/getAllBooks">
            <label for="method">Method </label>
            <select id="methodSelect" name="method">
                <option value="get">GET</option>
                <option value="head">HEAD</option>
            </select>
            <input type="submit" />
            <br><br><br>
            <section id="content"></section>
        </form>
    </div>

    <div class="endpoint">
        <h2>Get Authors</h2>
        <form id="getAuthorsForm" action="/getAuthors">
            <label for="country">Country </label>
            <input id="countryField" name="country">
            <p>AND/OR</p>
            <label for="language">Language </label>
            <input id="languageField" name="language">
            <p></p>
            <label for="method">Method </label>
            <select id="methodSelect" name="method">
                <option value="get">GET</option>
                <option value="head">HEAD</option>
            </select>
            <input type="submit" />
            <br><br><br>
            <section id="content"></section>
        </form>
    </div>

    <!-- POST Endpoints -->
    <div class="endpoint">
        <h2>Add Book</h2>
        <form id="addBookForm" action="/addBook" method="post">
            <label for="author">Author* </label>
            <input id="authorField" type="text" name="author">
            <br>
            <label for="country">Country </label>
            <input id="countryField" type="text" name="country">
            <br>
            <label for="language">Language </label>
            <input id="languageField" type="text" name="language">
            <br>
            <label for="link">Link </label>
            <input id="linkField" type="url" name="link">
            <br>
            <label for="pages">Pages </label>
            <input id="pageField" type="number" name="pages">
            <br>
            <label for="title">Title* </label>
            <input id="titleField" type="text" name="title">
            <br>
            <label for="year">Year Published </label>
            <input id="yearField" type="number" max=2026 name="year">
            <br>
            <label for="genres">Genres </label>
            <input id="genresField" type="text" name="genres">
            <p></p>
            <label for="type">Data Type </label>
            <select id="dataTypeField" name="type">
                <option value="application/json">JSON</option>
                <option value="application/x-www-form-urlencoded">URL Encoded</option>
            </select>
            <input type="submit" />
            <p>*required field</p>
            <br><br>
            <section id="content"></section>
        </form>
    </div>

    <div class="endpoint">
        <h2>Review Book</h2>
        <form id="reviewBookForm" action="/reviewBook" method="post">
            <label for="title">Title* </label>
            <input id="titleField" type="text" name="title">
            <br>
            <label for="author">Author* </label>
            <input id="authorField" type="text" name="author">
            <br>
            <label for="review">Review* </label>
            <input id="reviewField" type="text" name="review">
            <p></p>
            <label for="type">Data Type </label>
            <select id="dataTypeField" name="type">
                <option value="application/json">JSON</option>
                <option value="application/x-www-form-urlencoded">URL Encoded</option>
            </select>
            <input type="submit" />
            <p>*required field</p>
            <br><br>
            <section id="content"></section>
        </form>
    </div>
</body>
</html>
