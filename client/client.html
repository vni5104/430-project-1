<!DOCTYPE html>
<html lang="en">
<head>
    <title>Books Web API</title>

    <script>
        const handleResponse = async (response, method) => {
            const content = document.querySelector('#content');

            switch (response.status) {
                case 200:
                    content.innerHTML = `<b>Success</b>`;
                    break;
                case 201:
                    content.innerHTML = `<b>Created</b>`;
                    break;
                case 204:
                    content.innerHTML = `<b>Updated (No Content)</b>`;
                    break;
                case 400:
                    content.innerHTML = `<b>Bad Request</b>`;
                    break;
                case 404:
                    content.innerHTML = `<b>Resource Not Found</b>`;
                    break;
                default:
                    content.innerHTML = `<b>Error code not implemented by client</b>`;
                    break;
            }

            if (method != 'head') {
                const obj = await response.json();

                if (obj.message) {
                    content.innerHTML += `<p>${obj.message}</p>`;
                }
                if (obj.books) {
                    for (let i = 0; i < obj.books.length; i++) {
                        content.innerHTML += `<p>${JSON.stringify(obj.books[i])}</p>`;
                    }
                }
            }
        }

        const sendGetBook = async (getBookForm) => {
            let url = getBookForm.getAttribute('action');
            const method = getBookForm.querySelector('#methodSelect').value;

            const title = getBookForm.querySelector('#titleField').value;
            if (title) {
                url += `?title=${title}`;
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    Accept: 'application/json'
                }
            });

            handleResponse(response, method);
        };

        const sendAddBook = async (addBookForm) => {
            const url = addBookForm.getAttribute('action');
            const method = addBookForm.getAttribute('method');
            const type = addBookForm.querySelector('#dataTypeField').value;

            const author = addBookForm.querySelector('#authorField').value;
            const country = addBookForm.querySelector('#countryField').value;
            const language = addBookForm.querySelector('#languageField').value;
            const link = addBookForm.querySelector('#linkField').value;
            const pages = addBookForm.querySelector('#pageField').value;
            const title = addBookForm.querySelector('#titleField').value;
            const year = addBookForm.querySelector('#yearField').value;
            const genreValues = addBookForm.querySelector('#genresField').value;

            const genres = genreValues.split(',');

            let data = `author=${author}&country=${country}&language=${language}` + 
            `&link=${link}&pages=${pages}&title=${title}&year=${year}&genres=${genres}`;

            if (type === 'application/json') {
                data = JSON.stringify({
                    author: author,
                    country: country,
                    language: language,
                    link: link,
                    pages: pages,
                    title: title,
                    year: year,
                    genres: genres
                });
            }

            const response = await fetch (url, {
                method,
                headers: {
                    'Content-Type': type,
                    Accept: 'application/json'
                },
                body: data
            });

            handleResponse(response, method);
        };

        const init = () => {
            const getBookForm = document.querySelector('#getBookForm');
            getBookForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendGetBook(getBookForm);
                return false;
            });

            const addBookForm = document.querySelector('#addBookForm');
            addBookForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendAddBook(addBookForm);
                return false;
            });
        };

        window.onload = init;
    </script>
</head>
<body>
    <h1>Books Web API</h1>

    <!-- GET/HEAD Endpoints -->
    <h2>Get Book</h2>
    <form id="getBookForm" action="/getBook">
        <label for="title">Title </label>
        <input id="titleField" type="text" name="title">
        <select id="methodSelect">
            <option value="get">GET</option>
            <option value="head">HEAD</option>
        </select>
        <input type="submit" />
    </form>
    <form id="getBooksForm" action="/getBooks">
        <label for="author">Title </label>
        <input id="authorField" type="text" name="author">
        <label for="genres">Title </label>
        <input id="genresField" type="text" name="genres">
    </form>
    <form></form>
    <form action="/getAuthors"></form>

    <!-- POST Endpoints -->
    <h2>Add Book</h2>
    <form id="addBookForm" action="/addBook" method="post">
        <label for="author">Author </label>
        <input id="authorField" type="text" name="author">
        <label for="country">Country </label>
        <input id="countryField" type="text" name="country">
        <label for="language">Language </label>
        <input id="languageField" type="text" name="language">
        <label for="link">Link </label>
        <input id="linkField" type="url" name="link">
        <label for="pages">Pages </label>
        <input id="pageField" type="number" name="pages">
        <label for="title">Title </label>
        <input id="titleField" type="text" name="title">
        <label for="year">Year Published </label>
        <input id="yearField" type="number" max=2026 name="year">
        <label for="genres">Genres </label>
        <input id="genresField" type="text" name="genres">
        <select id="dataTypeField">
            <option value="application/json">JSON</option>
            <option value="application/x-www-form-urlencoded">URL Encoded</option>
        </select>
        <input type="submit">
    </form>

    <section id="content"></section>
</body>
</html>
