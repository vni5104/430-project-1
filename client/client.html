<!DOCTYPE html>
<html lang="en">
<head>
    <title>Books Web API</title>

    <script>

        const sendGetBook = async (getBookForm) => {
            let url = getBookForm.getAttribute('action');
            const method = getBookForm.querySelector('#methodSelect').value;

            const title = getBookForm.querySelector('#titleField').value;
            if (title) {
                url += `?title=${title}`;
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    Accept: 'application/json'
                }
            });
        };

        const sendAddBook = (addBookForm) => {
            //
        };

        const init = () => {
            const getBookForm = document.querySelector('#getBookForm');
            getBookForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendGetBook(getBookForm);
                return false;
            });

            const addBookForm = document.querySelector('#addBookForm');
            addBookForm.addEventListener('submit', (e) => {

        window.onload = init;
